notebook-templates:
    candy:
        description: |
            Starter notebook templates for jupyter
            Provisions a small set of starter .ipynb files into the workspace
            volume at deploy time so a fresh JupyterLab pod has runnable
            examples on first open. Data-only — no packages, no services. The
            data: block copies candy/notebook-templates/data/notebooks/
            into the volume's root; consumers (jupyter, jupyter-ml) compose
            this layer to ship the templates.
        data:
            - src: data/notebooks
              volume: workspace
        plan:
            - check: workspace volume is mounted as a directory at the canonical path
              context:
                - runtime
              file:
                file: ${VOLUME_CONTAINER_PATH:workspace}
                filetype: directory
            - check: at least one .ipynb starter template is present in that workspace
              exit_status: 0
              stdout:
                - matches: "\\.ipynb"
              context:
                - runtime
              command: find ${VOLUME_CONTAINER_PATH:workspace} -maxdepth 3 -name "*.ipynb" -print -quit

notebook-templates-skill:
    skill:
        name: notebook-templates
        family: jupyter
        owner: notebook-templates
        description: |-
            Starter notebook templates provisioned into the workspace volume at deploy time.
            First data-only candy in the project — no packages, no services, no dependencies.
            Use when working with notebook-templates, data candies, or jupyter initial content.
